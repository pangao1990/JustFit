<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#DDF6F3">
  <link rel="icon" type="image/png" href="/assets/game-icon.png">
  <title>装满这一箱 · 浏览器预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.2), transparent 26%),
        linear-gradient(145deg, #342b46, #1f1a2b);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      touch-action: none;
      user-select: none;
    }
    .phone {
      position: relative;
      width: min(100vw, calc(100vh * 375 / 812), 430px);
      aspect-ratio: 375 / 812;
      overflow: hidden;
      background: #fff8e8;
      box-shadow: 0 25px 80px rgba(0,0,0,.38);
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .preview-label {
      position: fixed;
      left: 16px;
      bottom: 14px;
      color: rgba(255,255,255,.58);
      font-size: 12px;
      letter-spacing: .04em;
      pointer-events: none;
    }
    @media (max-width: 600px) {
      .phone { width: 100vw; height: 100vh; aspect-ratio: auto; }
      .preview-label { display: none; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="装满这一箱游戏预览">
    <canvas width="375" height="812"></canvas>
  </main>
  <div class="preview-label">本地浏览器预览 · 奖励视频会模拟完整观看</div>
  <script src="./web/wx-shim.js"></script>
  <script src="./web/game.bundle.js"></script>
</body>
</html>
